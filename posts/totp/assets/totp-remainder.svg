<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-labelledby="title description"><title id="title">Discard whole millions and keep the six code digits</title><desc id="description">The number 1094287082 splits into 1094 whole millions, which are discarded, and remainder 287082, displayed in six separate code positions. Leading zeros would be retained.</desc><style>svg{--bg:#fafaf9;--fg:#23272d;--secondary:#5d6570;--line:#cbd1d8;--soft:#efefed;--focus:#dce9fa;--accent:#1855a0;--change:#8c4209;--changefill:#ffead9}@media(prefers-color-scheme:dark){svg{--bg:#0d1117;--fg:#e6e9ee;--secondary:#aeb8c5;--line:#3d4857;--soft:#181f29;--focus:#223c5b;--accent:#b7d6ff;--change:#ffc28d;--changefill:#4b301e}}text{fill:var(--fg);font-family:system-ui,sans-serif;font-size:22px}.label{fill:var(--secondary);font-size:20px}.mono{font-family:Menlo,Consolas,monospace}.accent{fill:var(--accent)}.change{fill:var(--change)}</style><rect width="480" height="350" fill="var(--bg)"/><rect x="12" y="12" width="456" height="326" rx="8" fill="var(--bg)" stroke="var(--line)"/><text x="24" y="40" class="" text-anchor="start" style="font-size:22px">Keep six decimal digits</text><text x="24" y="70" class="label" text-anchor="start" style="font-size:22px">Whole millions and a remainder</text><rect x="24" y="92" width="84" height="72" rx="5" fill="var(--soft)"/><text x="66" y="138" class="mono label" text-anchor="middle" style="font-size:28px">1094</text><rect x="132" y="92" width="44" height="72" rx="5" fill="var(--focus)"/><text x="154" y="138" class="mono accent" text-anchor="middle" style="font-size:32px">2</text><rect x="184" y="92" width="44" height="72" rx="5" fill="var(--focus)"/><text x="206" y="138" class="mono accent" text-anchor="middle" style="font-size:32px">8</text><rect x="236" y="92" width="44" height="72" rx="5" fill="var(--focus)"/><text x="258" y="138" class="mono accent" text-anchor="middle" style="font-size:32px">7</text><rect x="288" y="92" width="44" height="72" rx="5" fill="var(--focus)"/><text x="310" y="138" class="mono accent" text-anchor="middle" style="font-size:32px">0</text><rect x="340" y="92" width="44" height="72" rx="5" fill="var(--focus)"/><text x="362" y="138" class="mono accent" text-anchor="middle" style="font-size:32px">8</text><rect x="392" y="92" width="44" height="72" rx="5" fill="var(--focus)"/><text x="414" y="138" class="mono accent" text-anchor="middle" style="font-size:32px">2</text><text x="66" y="197" class="label" text-anchor="middle" style="font-size:18px">Whole</text><text x="66" y="219" class="label" text-anchor="middle" style="font-size:18px">millions</text><text x="284" y="201" class="" text-anchor="middle" style="font-size:20px">Six-digit code</text><text x="66" y="250" class="label" text-anchor="middle" style="font-size:18px">Discard</text><text x="284" y="250" class="accent" text-anchor="middle" style="font-size:20px">Keep</text><text x="240" y="292" class="mono" text-anchor="middle" style="font-size:18px">1094287082 mod 1000000 = 287082</text><text x="240" y="328" class="label" text-anchor="middle" style="font-size:18px">Write the remainder in six positions.</text></svg>
