<svg xmlns="http://www.w3.org/2000/svg" width="480" height="752" viewBox="0 0 480 752" role="img" aria-labelledby="title description">
<title id="title">Clear the first bit of the same four selected bytes</title>
<desc id="description">The selected positions 11 through 14 retain their blue fill and the starting position 11 retains its blue outline. Before: c1 39 7e ea. After clearing the first bit: 41 39 7e ea. Each tile shows its original position, hexadecimal value, and eight binary bits. Only the highest bit changes.</desc>
