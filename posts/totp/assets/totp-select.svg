<svg xmlns="http://www.w3.org/2000/svg" width="480" height="830" viewBox="0 0 480 830" role="img" aria-labelledby="title description"><title id="title">The last byte chooses a 32-bit slice</title><desc id="description">First see the full twenty-byte HMAC result, its last byte ab outlined in amber, and positions eleven through fourteen highlighted in blue. Then follow the numbered guide. One: find the last byte at position nineteen. Two: ab is binary 1010 1011; the rightmost bits one zero one one mean eight plus zero plus two plus one, or eleven. Three: start at position eleven and keep four bytes including that one, c1 39 7e ea.</desc><style>svg{--bg:#fafaf9;--fg:#23272d;--secondary:#5d6570;--line:#cbd1d8;--soft:#efefed;--focus:#dce9fa;--accent:#1855a0;--source:#8c4209;--sourcefill:#ffead9}@media(prefers-color-scheme:dark){svg{--bg:#0d1117;--fg:#e6e9ee;--secondary:#aeb8c5;--line:#3d4857;--soft:#181f29;--focus:#223c5b;--accent:#b7d6ff;--source:#ffc28d;--sourcefill:#4b301e}}text{fill:var(--fg);font-family:system-ui,sans-serif;font-size:22px}.label{font-size:20px;fill:var(--secondary)}.mono{font-family:Menlo,Consolas,monospace}.accent{fill:var(--accent)}.source{fill:var(--source)}</style><rect width="480" height="830" fill="var(--bg)" /><text x="24" y="30" class="label" text-anchor="start" style="font-size:22px">20-byte HMAC result · positions 0–19</text><rect x="18" y="48" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="50" y="66" class="label mono" text-anchor="middle" style="font-size:18px">0</text><text x="50" y="97" class="mono " text-anchor="middle" style="font-size:26px">75</text><rect x="113" y="48" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="145" y="66" class="label mono" text-anchor="middle" style="font-size:18px">1</text><text x="145" y="97" class="mono " text-anchor="middle" style="font-size:26px">a4</text><rect x="208" y="48" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="240" y="66" class="label mono" text-anchor="middle" style="font-size:18px">2</text><text x="240" y="97" class="mono " text-anchor="middle" style="font-size:26px">8a</text><rect x="303" y="48" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="335" y="66" class="label mono" text-anchor="middle" style="font-size:18px">3</text><text x="335" y="97" class="mono " text-anchor="middle" style="font-size:26px">19</text><rect x="398" y="48" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="430" y="66" class="label mono" text-anchor="middle" style="font-size:18px">4</text><text x="430" y="97" class="mono " text-anchor="middle" style="font-size:26px">d4</text><rect x="18" y="114" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="50" y="132" class="label mono" text-anchor="middle" style="font-size:18px">5</text><text x="50" y="163" class="mono " text-anchor="middle" style="font-size:26px">cb</text><rect x="113" y="114" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="145" y="132" class="label mono" text-anchor="middle" style="font-size:18px">6</text><text x="145" y="163" class="mono " text-anchor="middle" style="font-size:26px">e1</text><rect x="208" y="114" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="240" y="132" class="label mono" text-anchor="middle" style="font-size:18px">7</text><text x="240" y="163" class="mono " text-anchor="middle" style="font-size:26px">00</text><rect x="303" y="114" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="335" y="132" class="label mono" text-anchor="middle" style="font-size:18px">8</text><text x="335" y="163" class="mono " text-anchor="middle" style="font-size:26px">64</text><rect x="398" y="114" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="430" y="132" class="label mono" text-anchor="middle" style="font-size:18px">9</text><text x="430" y="163" class="mono " text-anchor="middle" style="font-size:26px">4e</text><rect x="18" y="180" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="50" y="198" class="label mono" text-anchor="middle" style="font-size:18px">10</text><text x="50" y="229" class="mono " text-anchor="middle" style="font-size:26px">8a</text><rect x="113" y="180" width="64" height="60" rx="4" fill="var(--focus)" stroke="var(--accent)" stroke-width="2" /><text x="145" y="198" class="label mono" text-anchor="middle" style="font-size:18px">11</text><text x="145" y="229" class="mono " text-anchor="middle" style="font-size:26px">c1</text><rect x="208" y="180" width="64" height="60" rx="4" fill="var(--focus)" stroke="none" stroke-width="2" /><text x="240" y="198" class="label mono" text-anchor="middle" style="font-size:18px">12</text><text x="240" y="229" class="mono " text-anchor="middle" style="font-size:26px">39</text><rect x="303" y="180" width="64" height="60" rx="4" fill="var(--focus)" stroke="none" stroke-width="2" /><text x="335" y="198" class="label mono" text-anchor="middle" style="font-size:18px">13</text><text x="335" y="229" class="mono " text-anchor="middle" style="font-size:26px">7e</text><rect x="398" y="180" width="64" height="60" rx="4" fill="var(--focus)" stroke="none" stroke-width="2" /><text x="430" y="198" class="label mono" text-anchor="middle" style="font-size:18px">14</text><text x="430" y="229" class="mono " text-anchor="middle" style="font-size:26px">ea</text><rect x="18" y="246" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="50" y="264" class="label mono" text-anchor="middle" style="font-size:18px">15</text><text x="50" y="295" class="mono " text-anchor="middle" style="font-size:26px">74</text><rect x="113" y="246" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="145" y="264" class="label mono" text-anchor="middle" style="font-size:18px">16</text><text x="145" y="295" class="mono " text-anchor="middle" style="font-size:26px">7a</text><rect x="208" y="246" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="240" y="264" class="label mono" text-anchor="middle" style="font-size:18px">17</text><text x="240" y="295" class="mono " text-anchor="middle" style="font-size:26px">2d</text><rect x="303" y="246" width="64" height="60" rx="4" fill="var(--bg)" stroke="none" stroke-width="2" /><text x="335" y="264" class="label mono" text-anchor="middle" style="font-size:18px">18</text><text x="335" y="295" class="mono " text-anchor="middle" style="font-size:26px">33</text><rect x="398" y="246" width="64" height="60" rx="4" fill="var(--bg)" stroke="var(--source)" stroke-width="2" /><text x="430" y="264" class="label mono" text-anchor="middle" style="font-size:18px">19</text><text x="430" y="295" class="mono source" text-anchor="middle" style="font-size:26px">ab</text>
<rect x="12" y="358" width="456" height="458" rx="8" fill="var(--bg)" stroke="var(--line)"/>
<text x="32" y="393" class="" text-anchor="start" style="font-size:22px">Find the starting position</text>
<circle cx="38" cy="429" r="12" fill="var(--soft)"/><text x="38" y="435" class="mono source" text-anchor="middle" style="font-size:18px">1</text><text x="62" y="435" class="" text-anchor="start" style="font-size:20px">Read the last byte · position 19</text>
<text x="62" y="466" class="label" text-anchor="start" style="font-size:18px">Each hex digit represents four bits.</text>
<text x="142" y="493" class="label" text-anchor="middle" style="font-size:18px">Hex</text>
<text x="142" y="531" class="mono label" text-anchor="middle" style="font-size:36px">a</text>
<path d="M142 541v16m-5-5 5 5 5-5" fill="none" stroke="var(--secondary)" stroke-width="2"/>
<text x="142" y="579" class="label" text-anchor="middle" style="font-size:18px">Left 4 · ignore</text>
<rect x="62" y="594" width="34" height="38" rx="4" fill="var(--soft)"/>
<text x="79" y="622" class="mono label" text-anchor="middle" style="font-size:26px">1</text>
<rect x="104" y="594" width="34" height="38" rx="4" fill="var(--soft)"/>
<text x="121" y="622" class="mono label" text-anchor="middle" style="font-size:26px">0</text>
<rect x="146" y="594" width="34" height="38" rx="4" fill="var(--soft)"/>
<text x="163" y="622" class="mono label" text-anchor="middle" style="font-size:26px">1</text>
<rect x="188" y="594" width="34" height="38" rx="4" fill="var(--soft)"/>
<text x="205" y="622" class="mono label" text-anchor="middle" style="font-size:26px">0</text>
<text x="350" y="493" class="label" text-anchor="middle" style="font-size:18px">Hex</text>
<text x="350" y="531" class="mono source" text-anchor="middle" style="font-size:36px">b</text>
<path d="M350 541v16m-5-5 5 5 5-5" fill="none" stroke="var(--secondary)" stroke-width="2"/>
<text x="350" y="579" class="label" text-anchor="middle" style="font-size:18px">Right 4 · keep</text>
<rect x="270" y="594" width="34" height="38" rx="4" fill="var(--sourcefill)"/>
<text x="287" y="622" class="mono source" text-anchor="middle" style="font-size:26px">1</text>
<path d="M270 631h34" stroke="var(--source)" stroke-width="2"/>
<text x="287" y="657" class="mono label" text-anchor="middle" style="font-size:18px">×8</text>
<rect x="312" y="594" width="34" height="38" rx="4" fill="var(--soft)"/>
<text x="329" y="622" class="mono source" text-anchor="middle" style="font-size:26px">0</text>
<path d="M312 631h34" stroke="var(--source)" stroke-width="2"/>
<text x="329" y="657" class="mono label" text-anchor="middle" style="font-size:18px">×4</text>
<rect x="354" y="594" width="34" height="38" rx="4" fill="var(--sourcefill)"/>
<text x="371" y="622" class="mono source" text-anchor="middle" style="font-size:26px">1</text>
<path d="M354 631h34" stroke="var(--source)" stroke-width="2"/>
<text x="371" y="657" class="mono label" text-anchor="middle" style="font-size:18px">×2</text>
<rect x="396" y="594" width="34" height="38" rx="4" fill="var(--sourcefill)"/>
<text x="413" y="622" class="mono source" text-anchor="middle" style="font-size:26px">1</text>
<path d="M396 631h34" stroke="var(--source)" stroke-width="2"/>
<text x="413" y="657" class="mono label" text-anchor="middle" style="font-size:18px">×1</text>
<text x="62" y="686" class="label" text-anchor="start" style="font-size:18px">Add the weights where the bit is 1.</text>
<text x="246" y="727" class="mono source" text-anchor="middle" style="font-size:24px">8 + 0 + 2 + 1 = 11</text>
<circle cx="38" cy="760" r="12" fill="var(--soft)"/><text x="38" y="766" class="mono accent" text-anchor="middle" style="font-size:18px">2</text><text x="62" y="766" class="" text-anchor="start" style="font-size:20px">Start at byte position 11</text>
<text x="62" y="799" class="label" text-anchor="start" style="font-size:18px">Keep positions 11–14, counting from zero.</text>
</svg>
