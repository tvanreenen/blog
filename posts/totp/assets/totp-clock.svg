<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="title description"><title id="title">Time 59 sits between the boundaries 30 and 60</title><desc id="description">The fixed Now marker shows 59 above active window 1. Timestamps at each break mark the beginning of a new thirty-second window. Divide time t by thirty and round down to get counter 1.</desc><style>svg{--bg:#fafaf9;--fg:#23272d;--secondary:#5d6570;--line:#cbd1d8;--soft:#efefed;--focus:#f6e8db;--time:#8c4209} @media(prefers-color-scheme:dark){svg{--bg:#0d1117;--fg:#e6e9ee;--secondary:#aeb8c5;--line:#3d4857;--soft:#181f29;--focus:#33271d;--time:#ffc28d}} text{fill:var(--fg);font-family:system-ui,sans-serif;font-size:22px}.label{font-size:20px;fill:var(--secondary)}.mono{font-family:Menlo,Consolas,monospace}.time{fill:var(--time)}</style><rect width="480" height="310" fill="var(--bg)"/><rect x="-62.08" y="86" width="153.6" height="80" rx="6" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="14.72" y="116" text-anchor="middle" class="label">Window</text><text x="14.72" y="149" text-anchor="middle" class="mono">0</text><path d="M-62.08 166v10" stroke="var(--secondary)"/><text x="-62.08" y="203" text-anchor="middle" class="label mono">0</text><rect x="91.52" y="78" width="153.6" height="88" rx="6" fill="var(--focus)" stroke="var(--time)" stroke-width="2"/><text x="168.32" y="116" text-anchor="middle" class="time">Active</text><text x="168.32" y="149" text-anchor="middle" class="mono">1</text><path d="M91.52 166v10" stroke="var(--secondary)"/><text x="91.52" y="203" text-anchor="middle" class="label mono">30</text><rect x="245.12" y="86" width="153.6" height="80" rx="6" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="321.92" y="116" text-anchor="middle" class="label">Window</text><text x="321.92" y="149" text-anchor="middle" class="mono">2</text><path d="M245.12 166v10" stroke="var(--secondary)"/><text x="245.12" y="203" text-anchor="middle" class="label mono">60</text><rect x="398.72" y="86" width="153.6" height="80" rx="6" fill="var(--soft)" stroke="var(--line)" stroke-width="1"/><text x="475.52" y="116" text-anchor="middle" class="label">Window</text><text x="475.52" y="149" text-anchor="middle" class="mono">3</text><path d="M398.72 166v10" stroke="var(--secondary)"/><text x="398.72" y="203" text-anchor="middle" class="label mono">90</text><text x="240" y="25" text-anchor="middle" class="mono" style="font-size:28px">59</text><rect x="195" y="35" width="90" height="28" rx="4" fill="var(--fg)"/><text x="240" y="56" text-anchor="middle" style="fill:var(--bg);font-size:20px">Now · t</text><path d="M240 63v10 M235 72l5 6 5-6" fill="none" stroke="var(--fg)" stroke-width="2"/><text x="240" y="245" class="label" text-anchor="middle">Next window in 1 second</text><text x="240" y="286" text-anchor="middle" class="mono">floor(t ÷ 30) = 1</text></svg>
